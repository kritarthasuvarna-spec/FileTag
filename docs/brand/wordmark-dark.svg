<svg width="720" height="200" viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="dropFillWm" cx="38%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#8FB5FA"/>
      <stop offset="100%" stop-color="#4F8EF7"/>
    </radialGradient>
    <filter id="bleedBlurWm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <style>
      .wm-sans { font-family: 'DejaVu Sans'; font-weight: bold; }
      .wm-serif { font-family: 'DejaVu Serif'; font-style: italic; }
    </style>
  </defs>

  <rect x="0" y="0" width="720" height="200" fill="#1A1A1C"/>

  <!-- icon, scaled down and positioned left -->
  <g transform="translate(40, 40)">
    <ellipse cx="42" cy="86" rx="34" ry="14" fill="#4F8EF7" opacity="0.28" filter="url(#bleedBlurWm)"/>
    <circle cx="48" cy="60" r="30" fill="url(#dropFillWm)"/>
  </g>

  <!-- wordmark text -->
  <text x="160" y="118" font-size="72" fill="#F0F0F1">
    <tspan class="wm-sans">foot</tspan><tspan class="wm-serif">note</tspan>
  </text>
</svg>
